services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: buddywize
      POSTGRES_PASSWORD: buddywize_dev
      POSTGRES_DB: buddywize
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddywize"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ./backend
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Override with the shared environment database when the mobile app must
      # keep its existing users, recordings and refresh-token sessions.
      DATABASE_URL: ${DATABASE_URL:-postgres://buddywize:buddywize_dev@postgres:5432/buddywize}
      HOST: 0.0.0.0
      PORT: "7878"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@buddywize.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-buddywize}

      # Object storage. Leave R2_* unset to use the local filesystem at
      # /data/storage. Set R2_BUCKET + credentials to use Cloudflare R2.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      STORAGE_DIR: /data/storage

      # Cloudflare Workers AI for both the STT (Whisper) and the
      # study-material generator (DeepSeek). CF_AI_TOKEN must be a
      # Cloudflare API token with Workers AI:Read.
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CF_AI_TOKEN: ${CF_AI_TOKEN:-}
      # STT_PROVIDER=cloudflare (default; GPU Whisper turbo) | local | mock
      STT_PROVIDER: ${STT_PROVIDER:-cloudflare}
      # Optional override of the Cloudflare Whisper model id.
      CF_WHISPER_MODEL: ${CF_WHISPER_MODEL:-}
      # STUDY_GENERATOR=cloudflare-deepseek (default) | mock
      STUDY_GENERATOR: ${STUDY_GENERATOR:-cloudflare-deepseek}
      # AGENDA_PARSER=cloudflare-gemma (default) | mock
      AGENDA_PARSER: ${AGENDA_PARSER:-cloudflare-gemma}
      # Optional override of the Gemma agenda-OCR model id.
      CF_GEMMA_MODEL: ${CF_GEMMA_MODEL:-}

      RUST_LOG: buddywize=debug,tower_http=info
    ports:
      - "7878:7878"
    volumes:
      - storage:/data/storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:7878/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  admin:
    build:
      context: ./admin
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Served by the static preview server; the browser calls the API via VITE_API_URL
      VITE_API_URL: http://localhost:7878/api
    ports:
      - "5173:5173"

volumes:
  pgdata:
  storage:
