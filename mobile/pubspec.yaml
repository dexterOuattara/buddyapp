name: buddywize
description: "Offline-first course companion — agenda, lesson recordings, AI study material."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Local database (offline-first source of truth)
  drift: ^2.34.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.5
  path: ^1.9.0

  # Networking & sync
  http: ^1.5.0
  connectivity_plus: ^6.1.0

  # Recording
  record: ^6.1.1

  # Camera + image resize for agenda scan (keeps uploads small for
  # African mobile data budgets).
  camera: ^0.11.0+2
  image: ^4.3.0
  permission_handler: ^11.3.1
  http_parser: ^4.0.2

  # Utilities
  uuid: ^4.5.1
  intl: ">=0.19.0 <0.21.0"
  shared_preferences: ^2.5.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
